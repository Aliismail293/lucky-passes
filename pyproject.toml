[project]
name = "lucky-passes"
version = "0.1.0"
description = "Measure lucky passes: RAG answers scored correct although no gold passage was retrieved."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ali Ekramy Ismail" }]
dependencies = [
    "ragaudit-cli>=0.4.0",
    "httpx>=0.27",
    "numpy>=1.26",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "pyarrow>=26.0.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.10",
    "types-PyYAML",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["lp"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
ignore_missing_imports = true
